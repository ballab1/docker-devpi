
services:

  dev:
    env_file:
      - .env
    build:
      context: ./
      args:
        ARG_DEVPI_COMMON_VERSION: ${DOCKER_DEVPI_COMMON_VERSION}
        ARG_DEVPI_SERVER_VERSION: ${DOCKER_DEVPI_SERVER_VERSION}
        ARG_DEVPI_WEB_VERSION: ${DOCKER_DEVPI_WEB_VERSION}
        ARG_DEVPI_CLIENT_VERSION: ${DOCKER_DEVPI_CLIENT_VERSION}
        ARG_DEVPI_THEME_VERSION: ${DOCKER_DEVPI_THEME_VERSION}
        ARG_DEVPI_JENKINS_VERSION: ${DOCKER_DEVPI_JENKINS_VERSION}
    image: s2.ubuntu.home:5000/docker.io/muccg/devpi:4.5.1
